<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Hopper</title>
<style>
  :root { --fg: #6e2f1f; --muted: #9a6a52; }
  html, body { margin: 0; height: 100%; }
  body {
    background: #efcfae; color: var(--fg);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
    overflow: hidden; touch-action: none;
  }
  #stage { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; }
  #top { flex: 1; width: 100%; display: flex; align-items: center; justify-content: center; }
  #wrap { position: relative; line-height: 0; }
  canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
  #msg { text-align: center; padding: 0 16px; line-height: 1.5; }
  #msg h1 { font-size: clamp(22px, 3.4vw, 40px); font-weight: 650; margin: 0 0 4px; letter-spacing: -0.02em; }
  #msg .lead { font-size: clamp(14px, 1.7vw, 20px); margin: 0 0 10px; color: var(--muted); }
  #msg .try { font-size: clamp(12px, 1.2vw, 14px); margin: 0 0 8px; color: var(--muted); }
  #msg .code { font-size: 11px; letter-spacing: 0.12em; color: var(--muted); opacity: .75; margin: 0 0 10px; }
  #msg kbd { font: inherit; font-size: 12px; padding: 1px 7px; border: 1.5px solid currentColor; border-radius: 5px; }
  #hint { font-size: 14px; margin: 0; }
  @media (max-width: 600px) { #msg .try { display: none; } }
  /* portrait phones: centre the band (message above it), like the original page */
  @media (orientation: portrait) {
    #stage { justify-content: center; }
    #top { flex: 0 0 auto; padding-bottom: 20px; }
  }
</style>
</head>
<body>
<div id="stage">
  <div id="top">
    <div id="msg">
      <h1>No signal.</h1>
      <p class="lead">The satellites are busy.</p>
      <p class="try">Try pointing the antenna at a quieter patch of sky, or checking the launch-pad cables.</p>
      <p class="code">ERR_ORBIT_CONGESTED</p>
      <p id="hint">Press <kbd>Space</kbd> or tap to hop &nbsp;·&nbsp; <kbd>&darr;</kbd> or swipe down to duck</p>
    </div>
  </div>
  <div id="wrap"><canvas id="c" aria-label="Hopper game"></canvas></div>
</div>
<script src="game.js"></script>
</body>
</html>
